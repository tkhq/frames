apiVersion: v1
kind: ServiceAccount
metadata:
  name: frames
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frames
spec:
  template:
    spec:
      initContainers:
        - name: template-quorum-key
          image: ghcr.io/tkhq/frames
          env:
            - name: TURNKEY_SIGNER_ENVIRONMENT
              value: "prod"
            # Collector for MessageChannel-vs-legacy channel telemetry
            # (INT-697 migration). Empty disables telemetry entirely.
            - name: TURNKEY_TELEMETRY_ENDPOINT
              value: ""
          command:
            - sh
            - -c
            - |
                mkdir -p templated/export templated/import templated/export-and-sign;

                envsubst '${TURNKEY_SIGNER_ENVIRONMENT}' < export/index.template.html > templated/export/index.html;

                # For export-and-sign, copy the webpack-built files and template the environment variable in HTML files
                # Note: We template HTML instead of JS to preserve Subresource Integrity (SRI) hashes
                if [ -d "export-and-sign" ]; then
                  cp -r export-and-sign/. templated/export-and-sign/;
                  ls -la templated/export-and-sign/
                fi

                TELEMETRY_ENDPOINT_HTML="";
                TELEMETRY_CSP_ORIGIN="";
                if [ -n "${TURNKEY_TELEMETRY_ENDPOINT}" ]; then
                  # Telemetry crosses the iframe boundary, so production
                  # collectors must use an absolute HTTPS URL. Fragments and
                  # markup-significant characters are rejected rather than
                  # being interpolated into the generated security policy.
                  case "${TURNKEY_TELEMETRY_ENDPOINT}" in
                    https://*) ;;
                    *)
                      echo "TURNKEY_TELEMETRY_ENDPOINT must be an absolute HTTPS URL" >&2;
                      exit 1;
                      ;;
                  esac
                  case "${TURNKEY_TELEMETRY_ENDPOINT}" in
                    *'"'*|*"'"*|*"<"*|*">"*|*" "*|*"#"*)
                      echo "TURNKEY_TELEMETRY_ENDPOINT contains unsupported characters" >&2;
                      exit 1;
                      ;;
                  esac

                  # Only the URL origin belongs in connect-src. The full URL,
                  # including an optional path/query, is HTML-escaped for the
                  # telemetry meta element.
                  TELEMETRY_CSP_ORIGIN=$(printf '%s' "${TURNKEY_TELEMETRY_ENDPOINT}" | sed -e 's#^\(https://[^/?#]*\).*$#\1#');
                  case "${TELEMETRY_CSP_ORIGIN}" in
                    "https://"|*'"'*|*"'"*|*" "*|*"<"*|*">"*|*"@"*|*";"*|*"\\"*)
                      echo "TURNKEY_TELEMETRY_ENDPOINT has an invalid origin" >&2;
                      exit 1;
                      ;;
                  esac
                  TELEMETRY_ENDPOINT_HTML=$(printf '%s' "${TURNKEY_TELEMETRY_ENDPOINT}" | sed -e 's/&/\&amp;/g' -e 's/"/\&quot;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g');
                fi

                # Escape sed replacement metacharacters after HTML escaping.
                TELEMETRY_ENDPOINT_ESCAPED=$(printf '%s' "${TELEMETRY_ENDPOINT_HTML}" | sed -e 's/[&\\|]/\\&/g');
                TELEMETRY_ORIGIN_ESCAPED=$(printf '%s' "${TELEMETRY_CSP_ORIGIN}" | sed -e 's/[&\\|]/\\&/g');

                # Template the environment variables in the HTML files (not JS, to preserve SRI)
                for file in templated/export-and-sign/*.html; do
                  if [ -f "$file" ]; then
                    if sed -e "s/__TURNKEY_SIGNER_ENVIRONMENT__/${TURNKEY_SIGNER_ENVIRONMENT}/g" -e "s|__TURNKEY_TELEMETRY_ENDPOINT__|${TELEMETRY_ENDPOINT_ESCAPED}|g" -e "s|__TURNKEY_TELEMETRY_ORIGIN__|${TELEMETRY_ORIGIN_ESCAPED}|g" "$file" > "$file.tmp"; then
                      mv "$file.tmp" "$file"
                    fi
                  fi
                done

                # Do the same for import: copy the webpack-built files and template the environment variable in JS files
                if [ -d "/usr/share/nginx/import" ]; then
                  cp -r /usr/share/nginx/import/. templated/import/;
                  ls -la templated/import/
                fi

                # Template the environment variable in the built JavaScript files
                for file in templated/import/*.js; do
                  if [ -f "$file" ]; then
                    if sed "s/__TURNKEY_SIGNER_ENVIRONMENT__/${TURNKEY_SIGNER_ENVIRONMENT}/g" "$file" > "$file.tmp"; then
                      mv "$file.tmp" "$file"
                    fi
                  fi
                done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: templated
              mountPath: /usr/share/nginx/templated
      containers:
        - name: frames
          image: ghcr.io/tkhq/frames
          ports:
            # iframes
            - name: auth
              containerPort: 8080
            - name: export
              containerPort: 8081
            - name: recovery
              containerPort: 8082
            - name: import
              containerPort: 8083
            - name: export-and-sign
              containerPort: 8086

            # oauth
            - name: oauth-origin
              containerPort: 8084
            - name: oauth-redirect
              containerPort: 8085
          livenessProbe:
            httpGet:
              path: /health
              port: auth
          resources:
            requests:
              memory: 5Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: templated
              mountPath: /usr/share/nginx/templated
              readOnly: true
      serviceAccountName: frames
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {}
          matchLabelKeys:
            - pod-template-hash
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {}
          matchLabelKeys:
            - pod-template-hash
      volumes:
        - name: templated
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frames
spec:
  ports:
    # iframe
    - name: http-auth
      port: 8080
      targetPort: auth
    - name: http-export
      port: 8081
      targetPort: export
    - name: http-recovery
      port: 8082
      targetPort: recovery
    - name: http-import
      port: 8083
      targetPort: import
    - name: http-exp-sign
      port: 8086
      targetPort: export-and-sign

    # oauth
    - name: http-oauth-og
      port: 8084
      targetPort: oauth-origin
    - name: http-oauth-rd
      port: 8085
      targetPort: oauth-redirect
